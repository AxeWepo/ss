name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/altps3/ps3dev:latest
    steps:
      - uses: actions/checkout@v4
      - run: make pkg
      - uses: actions/upload-artifact@v4
        with:
          name: pcscreen-pkg
          path: "*.pkg"
